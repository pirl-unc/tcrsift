# Run tests on push and pull requests
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          ruff check tcrsift/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=tcrsift --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage.xml
          flag-name: python-${{ matrix.python-version }}
          parallel: true

  coverage-finished:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pylint
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check tcrsift/

      - name: Run pylint
        run: |
          pylint tcrsift/ \
            --errors-only \
            --disable=unsubscriptable-object,not-an-iterable,no-member,invalid-unary-operand-type
