[project]
name = "tcrsift"
requires-python = ">=3.9"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "T-cell receptor selection for TCR-T studies from antigen specific culture and scRNA/VDJ sequencing"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.1.4",
    "scanpy>=1.10.2,<2.0.0",
    # concat_on_disk lives in anndata.experimental — pinning below 0.13
    # until the API stabilizes or moves out of experimental. Bump deliberately.
    "anndata>=0.10.0,<0.13.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.60.0,<5.0.0",
    # Sequence PDF is a default `tcrsift run` output, so reportlab is a
    # core dep (previously optional, which left the PDF silently skipped
    # when not installed — including on CI).
    "reportlab>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pylint>=3.0.0,<4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0.0",
]
assembly = [
    "pyensembl>=2.0.0,<3.0.0",
]
excel = [
    "openpyxl>=3.0.0,<4.0.0",
]
reports = [
    "reportlab>=4.0.0,<5.0.0",
    "pdfkit",
]
# Gold-standard Pgen/Ppost (#143). OLGA + SONIA are GPL-3.0 — kept as a
# runtime-optional extra (NOT vendored) so tcrsift stays Apache-2.0.
pgen = [
    "olga>=1.2.4",
    "sonia>=0.0.51",
]
# TCRpeg sequence-probability backend (tcrsift.seqprob). PyTorch-based,
# optional — the numpy-only k-mer backend is the default and needs nothing.
tcrpeg = [
    "tcrpeg>=1.0.0",
    "torch>=2.0.0",
]
full = [
    "pyensembl>=2.0.0,<3.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "pdfkit",
]

[tool.setuptools.dynamic]
version = {attr = "tcrsift.version.__version__"}

[tool.setuptools]
packages = ["tcrsift", "tcrsift.refseqs"]

[tool.setuptools.package-data]
"tcrsift.refseqs" = ["*.fasta", "*.npz"]

[project.urls]
"Homepage" = "https://github.com/pirl-unc/tcrsift"
"Documentation" = "https://pirl-unc.github.io/tcrsift/"
"Bug Tracker" = "https://github.com/pirl-unc/tcrsift/issues"

[project.scripts]
tcrsift = "tcrsift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
