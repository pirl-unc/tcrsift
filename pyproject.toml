[project]
name = "tcrsift"
requires-python = ">=3.9"
authors = [ {name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu" } ]
description = "T-cell receptor selection for TCR-T studies from antigen specific culture and scRNA/VDJ sequencing"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.1.4",
    "scanpy>=1.10.2,<2.0.0",
    # concat_on_disk lives in anndata.experimental — pinning below 0.13
    # until the API stabilizes or moves out of experimental. Bump deliberately.
    "anndata>=0.10.0,<0.13.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.60.0,<5.0.0",
    # Sequence PDF is a default `tcrsift run` output, so reportlab is a
    # core dep (previously optional, which left the PDF silently skipped
    # when not installed — including on CI). pypdf concatenates the per-run
    # vector figure PDFs into the `tcrsift report bundle` cohort PDF (#123).
    "reportlab>=4.0.0,<5.0.0",
    "pypdf>=4.0.0,<6.0.0",
    # Core, not extras (one library, shared deps): pyensembl is the shared
    # Ensembl↔HGNC mapping behind tcrsift.genes (used by all expression
    # lookups); openpyxl backs Excel export. Both permissively licensed.
    "pyensembl>=2.0.0,<3.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    # TCRpeg is the default Pgen/Ppost backend (tcrsift.seqprob), auto-trained
    # on first use — so it + torch are core, not an extra. (OLGA/SONIA stay
    # optional: GPL-3.0, and only the legacy olga_ppost path needs them.)
    "tcrpeg>=1.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Parallel test execution (-n auto in addopts) — ~2.5x faster suite.
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.0",
    "pylint>=3.0.0,<4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0.0",
]
reports = [
    "reportlab>=4.0.0,<5.0.0",
    "pdfkit",
]
# Optional N-way set-overlap (UpSet) plots (#208). Without it, plot_set_overlap
# falls back to a top-intersections bar chart, so this is purely a nicer view.
plots = [
    "upsetplot>=0.8",
]
# Gold-standard Pgen/Ppost (#143). OLGA + SONIA are GPL-3.0 — kept as a
# runtime-optional extra (NOT vendored) so tcrsift stays Apache-2.0.
pgen = [
    "olga>=1.2.4",
    "sonia>=0.0.51",
]
full = [
    "reportlab>=4.0.0,<5.0.0",
    "pdfkit",
    "upsetplot>=0.8",
]

[tool.setuptools.dynamic]
version = {attr = "tcrsift.version.__version__"}

[tool.setuptools]
packages = ["tcrsift", "tcrsift.refseqs"]

[tool.setuptools.package-data]
"tcrsift.refseqs" = ["*.fasta", "*.npz", "*.csv.gz", "PROVENANCE.md"]

[project.urls]
"Homepage" = "https://github.com/pirl-unc/tcrsift"
"Documentation" = "https://pirl-unc.github.io/tcrsift/"
"Bug Tracker" = "https://github.com/pirl-unc/tcrsift/issues"

[project.scripts]
tcrsift = "tcrsift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# -n auto runs the suite across all CPU cores via pytest-xdist (~2.5x faster).
addopts = "-n auto --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
